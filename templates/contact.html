{% extends "base.html" %}
{% block title %}Contact - SGM Hub{% endblock %}
{% block content %}
<style>
    .contact-wrapper {
        max-width: 520px;
        margin: 40px auto;
        padding: 0 20px;
    }

    .contact-header {
        margin-bottom: 32px;
        text-align: center;
    }
    .contact-header .subtitle {
        font-size: 0.8em;
        text-transform: uppercase;
        letter-spacing: 2px;
        color: #e94560;
        opacity: 0.6;
        margin-bottom: 6px;
        font-weight: 600;
    }
    .contact-header h1 {
        font-size: 2em;
        font-weight: 700;
        margin-bottom: 8px;
        background: linear-gradient(135deg, #fff, #e94560);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
    }
    .contact-header p {
        color: rgba(255,255,255,0.5);
        font-size: 0.95em;
        -webkit-text-fill-color: rgba(255,255,255,0.5);
    }

    /* ---- Glass Card ---- */
    .contact-card {
        background: rgba(22, 33, 62, 0.6);
        backdrop-filter: blur(16px) saturate(1.2);
        -webkit-backdrop-filter: blur(16px) saturate(1.2);
        border-radius: 20px;
        border: 1px solid rgba(233, 69, 96, 0.08);
        padding: 32px 28px;
        box-shadow: 0 8px 40px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.02);
        transition: border-color 0.3s ease, box-shadow 0.3s ease;
    }
    .contact-card:hover {
        border-color: rgba(233, 69, 96, 0.15);
        box-shadow: 0 12px 60px rgba(0,0,0,0.4), inset 0 1px 0 rgba(233,69,96,0.05);
    }

    /* ---- Form Fields with Icons ---- */
    .input-group {
        margin-bottom: 18px;
        position: relative;
    }
    .input-group label {
        font-size: 0.75em;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        font-weight: 600;
        color: rgba(255,255,255,0.4);
        display: block;
        margin-bottom: 6px;
    }
    .input-group .input-wrapper {
        position: relative;
        display: flex;
        align-items: center;
        background: rgba(15, 52, 96, 0.4);
        border-radius: 12px;
        border: 1px solid rgba(233, 69, 96, 0.08);
        transition: border-color 0.3s ease, box-shadow 0.3s ease, background 0.3s ease;
    }
    .input-group .input-wrapper:focus-within {
        border-color: #e94560;
        box-shadow: 0 0 0 3px rgba(233, 69, 96, 0.08);
        background: rgba(15, 52, 96, 0.6);
    }
    .input-group .input-wrapper i {
        position: absolute;
        left: 14px;
        color: #e94560;
        font-size: 0.9em;
        opacity: 0.5;
        transition: opacity 0.3s;
    }
    .input-group .input-wrapper:focus-within i {
        opacity: 1;
    }
    .input-group .input-wrapper input,
    .input-group .input-wrapper textarea {
        width: 100%;
        padding: 12px 16px 12px 44px;
        background: transparent;
        border: none;
        outline: none;
        color: #eee;
        font-size: 0.95em;
        font-family: 'Inter', sans-serif;
        border-radius: 12px;
        resize: vertical;
    }
    .input-group .input-wrapper textarea {
        padding-top: 14px;
        min-height: 120px;
    }
    .input-group .input-wrapper input::placeholder,
    .input-group .input-wrapper textarea::placeholder {
        color: rgba(255,255,255,0.2);
        font-weight: 400;
    }

    /* ---- Submit Button ---- */
    .submit-btn {
        width: 100%;
        padding: 14px;
        background: linear-gradient(135deg, #e94560, #c73652);
        color: #fff;
        border: none;
        border-radius: 12px;
        font-size: 1em;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        box-shadow: 0 4px 20px rgba(233, 69, 96, 0.2);
        font-family: 'Inter', sans-serif;
        letter-spacing: 0.3px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
    }
    .submit-btn:hover {
        transform: translateY(-2px) scale(1.01);
        box-shadow: 0 8px 30px rgba(233, 69, 96, 0.3);
    }
    .submit-btn:active {
        transform: scale(0.98);
    }
    .submit-btn:disabled {
        opacity: 0.7;
        cursor: not-allowed;
        transform: none !important;
    }

    /* ---- Success Message ---- */
    .success-msg {
        display: none;
        margin-top: 20px;
        padding: 14px 18px;
        background: rgba(78, 204, 163, 0.06);
        border: 1px solid rgba(78, 204, 163, 0.15);
        border-radius: 12px;
        text-align: center;
        color: #4ecca3;
        font-size: 0.9em;
        font-weight: 500;
        animation: fadeSlideIn 0.4s ease;
    }
    .success-msg i {
        margin-right: 8px;
    }
    @keyframes fadeSlideIn {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    /* ---- Direct Email Section (NEW) ---- */
    .direct-email {
        margin-top: 24px;
        text-align: center;
        padding: 18px;
        background: rgba(233, 69, 96, 0.04);
        border-radius: 16px;
        border: 1px solid rgba(233, 69, 96, 0.06);
        transition: border-color 0.3s;
    }
    .direct-email:hover {
        border-color: rgba(233, 69, 96, 0.12);
    }
    .direct-email .label {
        font-size: 0.75em;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        color: rgba(255,255,255,0.3);
        margin-bottom: 6px;
        display: block;
    }
    .direct-email a {
        color: #e94560;
        text-decoration: none;
        font-size: 1.05em;
        font-weight: 600;
        transition: all 0.2s;
        display: inline-flex;
        align-items: center;
        gap: 10px;
    }
    .direct-email a:hover {
        color: #ff6b81;
        transform: scale(1.02);
    }
    .direct-email a i {
        font-size: 0.9em;
        background: rgba(233,69,96,0.1);
        padding: 6px;
        border-radius: 50%;
        transition: background 0.3s;
    }
    .direct-email a:hover i {
        background: rgba(233,69,96,0.2);
    }

    /* ---- Footer Links (GitHub / About) ---- */
    .contact-footer-links {
        margin-top: 28px;
        display: flex;
        gap: 12px;
        justify-content: center;
        flex-wrap: wrap;
    }
    .contact-footer-links a {
        padding: 10px 22px;
        background: rgba(22, 33, 62, 0.4);
        backdrop-filter: blur(8px);
        border: 1px solid rgba(233, 69, 96, 0.06);
        border-radius: 30px;
        color: rgba(255,255,255,0.5);
        text-decoration: none;
        font-size: 0.85em;
        font-weight: 500;
        transition: all 0.3s ease;
        display: inline-flex;
        align-items: center;
        gap: 8px;
    }
    .contact-footer-links a:hover {
        background: rgba(233, 69, 96, 0.06);
        border-color: rgba(233, 69, 96, 0.15);
        color: #fff;
        transform: translateY(-2px);
    }
    .contact-footer-links a i {
        color: #e94560;
        font-size: 0.9em;
    }

    /* ===== LIGHT MODE ===== */
    body.light .contact-header h1 {
        background: linear-gradient(135deg, #1a1a2e, #c73652);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
    }
    body.light .contact-header p {
        color: rgba(0,0,0,0.4);
        -webkit-text-fill-color: rgba(0,0,0,0.4);
    }
    body.light .contact-card {
        background: rgba(237, 232, 226, 0.7);
        backdrop-filter: blur(16px);
        border-color: rgba(233, 69, 96, 0.06);
        box-shadow: 0 8px 40px rgba(0,0,0,0.04);
    }
    body.light .contact-card:hover {
        border-color: rgba(233, 69, 96, 0.15);
    }
    body.light .input-group label {
        color: rgba(0,0,0,0.3);
    }
    body.light .input-group .input-wrapper {
        background: rgba(220, 212, 204, 0.4);
        border-color: rgba(233, 69, 96, 0.06);
    }
    body.light .input-group .input-wrapper:focus-within {
        background: rgba(220, 212, 204, 0.6);
        border-color: #e94560;
        box-shadow: 0 0 0 3px rgba(233, 69, 96, 0.06);
    }
    body.light .input-group .input-wrapper input,
    body.light .input-group .input-wrapper textarea {
        color: #2a2015;
    }
    body.light .input-group .input-wrapper input::placeholder,
    body.light .input-group .input-wrapper textarea::placeholder {
        color: rgba(0,0,0,0.2);
    }
    body.light .direct-email {
        background: rgba(233, 69, 96, 0.03);
        border-color: rgba(233, 69, 96, 0.06);
    }
    body.light .direct-email .label {
        color: rgba(0,0,0,0.3);
    }
    body.light .contact-footer-links a {
        background: rgba(237, 232, 226, 0.6);
        color: rgba(0,0,0,0.4);
        border-color: rgba(233, 69, 96, 0.04);
    }
    body.light .contact-footer-links a:hover {
        background: rgba(233, 69, 96, 0.04);
        color: #1a1a2e;
    }
    body.light .submit-btn {
        box-shadow: 0 4px 20px rgba(233, 69, 96, 0.15);
    }
    body.light .submit-btn:hover {
        box-shadow: 0 8px 30px rgba(233, 69, 96, 0.25);
    }

    /* ===== MOBILE ===== */
    @media (max-width: 600px) {
        .contact-wrapper { margin: 20px auto; }
        .contact-card { padding: 24px 18px; border-radius: 16px; }
        .contact-header h1 { font-size: 1.6em; }
        .input-group .input-wrapper input,
        .input-group .input-wrapper textarea {
            font-size: 0.9em;
            padding: 11px 14px 11px 40px;
        }
        .direct-email a { font-size: 0.95em; }
        .contact-footer-links a { padding: 8px 16px; font-size: 0.8em; }
    }
</style>

<div class="contact-wrapper">
    <!-- Header -->
    <div class="contact-header">
        <div class="subtitle"><i class="fas fa-paper-plane" style="margin-right:6px;"></i>Contact</div>
        <h1>Let's Talk</h1>
        <p>Have a question or feedback? I'd love to hear from you.</p>
    </div>

    <!-- Form Card -->
    <div class="contact-card">
        <form id="contactForm" onsubmit="return false;">
            <div class="input-group">
                <label><i class="fas fa-user" style="margin-right:6px;"></i>Name</label>
                <div class="input-wrapper">
                    <i class="fas fa-user"></i>
                    <input type="text" id="name" placeholder="Your name" required>
                </div>
            </div>

            <div class="input-group">
                <label><i class="fas fa-envelope" style="margin-right:6px;"></i>Email</label>
                <div class="input-wrapper">
                    <i class="fas fa-envelope"></i>
                    <input type="email" id="email" placeholder="you@example.com" required>
                </div>
            </div>

            <div class="input-group">
                <label><i class="fas fa-pen" style="margin-right:6px;"></i>Message</label>
                <div class="input-wrapper">
                    <i class="fas fa-pen" style="top:16px; align-self:flex-start;"></i>
                    <textarea id="message" placeholder="Write your message..." rows="5" required></textarea>
                </div>
            </div>

            <button type="button" class="submit-btn" id="sendBtn" onclick="sendMsg()">
                <span id="btnText">Send Message</span>
                <i class="fas fa-arrow-right" id="btnIcon"></i>
            </button>

            <div class="success-msg" id="success">
                <i class="fas fa-check-circle"></i> Message sent! I'll get back to you soon.
            </div>
        </form>

        <!-- Direct Email (Gmail) -->
        <div class="direct-email">
            <span class="label"><i class="fas fa-at"></i> Or reach out directly</span>
            <a href="mailto:Sgmhub@gmail.com">
                <i class="fas fa-envelope"></i>
                Sgmhub@gmail.com
            </a>
        </div>
    </div>

    <!-- Footer Links -->
    <div class="contact-footer-links">
        <a href="https://github.com/Makanaref" target="_blank">
            <i class="fab fa-github"></i> GitHub
        </a>
        <a href="/about">
            <i class="fas fa-user"></i> About Me
        </a>
    </div>
</div>

<script>
async function sendMsg() {
    const name = document.getElementById("name").value.trim();
    const email = document.getElementById("email").value.trim();
    const message = document.getElementById("message").value.trim();

    if (!name || !email || !message) {
        alert("Please fill all fields!");
        return;
    }

    const btn = document.getElementById("sendBtn");
    const btnText = document.getElementById("btnText");
    const btnIcon = document.getElementById("btnIcon");
    const successDiv = document.getElementById("success");

    btn.disabled = true;
    btnText.innerText = "Sending...";
    btnIcon.className = "fas fa-spinner fa-spin";

    try {
        const res = await fetch("/api/contact", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ name, email, message })
        });
        const data = await res.json();

        if (res.ok && data.success) {
            successDiv.style.display = "block";
            document.getElementById("name").value = "";
            document.getElementById("email").value = "";
            document.getElementById("message").value = "";
        } else {
            alert(data.error || "Something went wrong. Please try again.");
        }
    } catch (err) {
        alert("Network error. Please try again.");
    } finally {
        btn.disabled = false;
        btnText.innerText = "Send Message";
        btnIcon.className = "fas fa-arrow-right";
    }
}
</script>
{% endblock %}
