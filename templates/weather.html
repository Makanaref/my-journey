{% extends "base.html" %}
{% block title %}Weather{% endblock %}
{% block content %}
<style>
    .weather-wrap {
        max-width: 480px;
        margin: 30px auto;
        padding: 0 16px;
    }
    .weather-header {
        text-align: center;
        margin-bottom: 28px;
    }
    .weather-header .badge {
        font-size: 0.7em;
        text-transform: uppercase;
        letter-spacing: 2px;
        color: rgba(255,255,255,0.2);
        font-weight: 600;
        display: block;
        margin-bottom: 4px;
    }
    .weather-header h1 {
        font-size: 2em;
        font-weight: 700;
        margin: 0;
        background: linear-gradient(135deg, #fff 30%, #e94560);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        letter-spacing: -0.5px;
    }
    .weather-header p {
        color: rgba(255,255,255,0.25);
        font-size: 0.85em;
        margin-top: 4px;
        -webkit-text-fill-color: rgba(255,255,255,0.25);
    }

    .weather-card {
        background: rgba(22, 33, 62, 0.5);
        backdrop-filter: blur(16px) saturate(1.2);
        -webkit-backdrop-filter: blur(16px) saturate(1.2);
        border-radius: 24px;
        border: 1px solid rgba(233,69,96,0.06);
        padding: 28px 24px;
        box-shadow: 0 8px 40px rgba(0,0,0,0.2), inset 0 1px 0 rgba(255,255,255,0.02);
        transition: border-color 0.3s, box-shadow 0.3s;
    }
    .weather-card:hover {
        border-color: rgba(233,69,96,0.1);
        box-shadow: 0 12px 60px rgba(0,0,0,0.25);
    }

    .input-group {
        margin-bottom: 18px;
        position: relative;
    }
    .input-group label {
        font-size: 0.7em;
        text-transform: uppercase;
        letter-spacing: 0.8px;
        color: rgba(255,255,255,0.2);
        font-weight: 600;
        display: block;
        margin-bottom: 6px;
    }
    .input-group .input-wrapper {
        position: relative;
        display: flex;
        align-items: center;
        background: rgba(15, 52, 96, 0.3);
        border-radius: 14px;
        border: 1px solid rgba(233,69,96,0.06);
        transition: border-color 0.3s, box-shadow 0.3s, background 0.3s;
    }
    .input-group .input-wrapper:focus-within {
        border-color: rgba(233,69,96,0.2);
        box-shadow: 0 0 0 3px rgba(233,69,96,0.03);
        background: rgba(15, 52, 96, 0.5);
    }
    .input-group .input-wrapper i {
        position: absolute;
        left: 14px;
        color: #e94560;
        font-size: 1em;
        opacity: 0.4;
        transition: opacity 0.3s;
    }
    .input-group .input-wrapper:focus-within i {
        opacity: 0.8;
    }
    .input-group .input-wrapper input {
        width: 100%;
        padding: 12px 16px 12px 44px;
        background: transparent;
        border: none;
        outline: none;
        color: #fff;
        font-size: 0.95em;
        font-family: 'Inter', sans-serif;
        border-radius: 14px;
    }
    .input-group .input-wrapper input::placeholder {
        color: rgba(255,255,255,0.1);
        font-weight: 400;
    }

    .btn-weather {
        width: 100%;
        padding: 14px;
        background: linear-gradient(135deg, #e94560, #c73652);
        color: #fff;
        border: none;
        border-radius: 14px;
        font-size: 1em;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        box-shadow: 0 4px 20px rgba(233,69,96,0.12);
        font-family: 'Inter', sans-serif;
        letter-spacing: 0.3px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
    }
    .btn-weather:hover {
        transform: translateY(-2px) scale(1.01);
        box-shadow: 0 8px 30px rgba(233,69,96,0.2);
    }
    .btn-weather:active {
        transform: scale(0.98);
    }

    .result-box {
        display: none;
        margin-top: 24px;
        animation: fadeSlide 0.4s ease;
    }
    @keyframes fadeSlide {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .weather-main {
        background: rgba(15, 52, 96, 0.3);
        border-radius: 16px;
        padding: 20px;
        text-align: center;
        border: 1px solid rgba(233,69,96,0.04);
        margin-bottom: 14px;
    }
    .weather-main .city {
        font-size: 1.1em;
        font-weight: 600;
        color: #e94560;
        margin: 0 0 2px;
    }
    .weather-main .temp {
        font-size: 3em;
        font-weight: 700;
        color: #fff;
        margin: 4px 0;
        letter-spacing: -1px;
    }
    .weather-main .desc {
        font-size: 0.9em;
        color: rgba(255,255,255,0.4);
        margin: 4px 0 0;
        text-transform: capitalize;
    }

    .weather-details {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
    }
    .weather-detail {
        background: rgba(15, 52, 96, 0.2);
        border-radius: 12px;
        padding: 14px 12px;
        text-align: center;
        border: 1px solid rgba(255,255,255,0.02);
        transition: border-color 0.2s;
    }
    .weather-detail:hover {
        border-color: rgba(233,69,96,0.06);
    }
    .weather-detail .label {
        font-size: 0.6em;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        color: rgba(255,255,255,0.15);
        font-weight: 600;
        margin-bottom: 2px;
    }
    .weather-detail .value {
        font-size: 1.2em;
        font-weight: 600;
        color: #fff;
        margin: 0;
    }
    .weather-detail .value i {
        margin-right: 6px;
        color: #e94560;
        opacity: 0.5;
        font-size: 0.9em;
    }

    .error-msg {
        display: none;
        margin-top: 16px;
        padding: 12px 16px;
        background: rgba(233,69,96,0.06);
        border: 1px solid rgba(233,69,96,0.08);
        border-radius: 12px;
        text-align: center;
        color: #e94560;
        font-size: 0.85em;
    }

    /* Light mode */
    body.light .weather-card {
        background: rgba(237, 232, 226, 0.5);
        backdrop-filter: blur(16px);
        border-color: rgba(0,0,0,0.02);
        box-shadow: 0 8px 40px rgba(0,0,0,0.02);
    }
    body.light .weather-card:hover {
        border-color: rgba(233,69,96,0.04);
        box-shadow: 0 12px 60px rgba(0,0,0,0.03);
    }
    body.light .input-group .input-wrapper {
        background: rgba(0,0,0,0.02);
        border-color: rgba(0,0,0,0.04);
    }
    body.light .input-group .input-wrapper:focus-within {
        border-color: rgba(233,69,96,0.1);
        background: rgba(0,0,0,0.03);
    }
    body.light .input-group .input-wrapper input {
        color: #1a1a2e;
    }
    body.light .input-group .input-wrapper input::placeholder {
        color: rgba(0,0,0,0.08);
    }
    body.light .weather-main {
        background: rgba(0,0,0,0.01);
        border-color: rgba(0,0,0,0.02);
    }
    body.light .weather-main .temp {
        color: #1a1a2e;
    }
    body.light .weather-main .desc {
        color: rgba(0,0,0,0.3);
    }
    body.light .weather-detail {
        background: rgba(0,0,0,0.01);
        border-color: rgba(0,0,0,0.02);
    }
    body.light .weather-detail .value {
        color: #1a1a2e;
    }
    body.light .weather-detail .label {
        color: rgba(0,0,0,0.1);
    }
    body.light .weather-header h1 {
        background: linear-gradient(135deg, #1a1a2e 30%, #c73652);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
    }
    body.light .weather-header p {
        color: rgba(0,0,0,0.2);
        -webkit-text-fill-color: rgba(0,0,0,0.2);
    }
    body.light .weather-header .badge {
        color: rgba(0,0,0,0.1);
    }
    body.light .btn-weather {
        box-shadow: 0 4px 20px rgba(233,69,96,0.04);
    }
    body.light .btn-weather:hover {
        box-shadow: 0 8px 30px rgba(233,69,96,0.08);
    }

    @media (max-width: 480px) {
        .weather-wrap { margin: 20px auto; padding: 0 12px; }
        .weather-card { padding: 20px 16px; border-radius: 20px; }
        .weather-main .temp { font-size: 2.4em; }
        .weather-details { grid-template-columns: 1fr 1fr; gap: 8px; }
        .weather-detail { padding: 10px 8px; }
        .weather-detail .value { font-size: 1em; }
    }
</style>

<div class="weather-wrap">
    <div class="weather-header">
        <span class="badge"><i class="fas fa-cloud-sun"></i> Weather</span>
        <h1>Check Forecast</h1>
        <p>Get current weather for any city</p>
    </div>

    <div class="weather-card">
        <div class="input-group">
            <label><i class="fas fa-map-pin"></i> City name</label>
            <div class="input-wrapper">
                <i class="fas fa-search"></i>
                <input type="text" id="city" placeholder="e.g. Tehran, London, New York" onkeydown="if(event.key==='Enter') getWeather();">
            </div>
        </div>

        <button class="btn-weather" onclick="getWeather()">
            <i class="fas fa-cloud-sun-rain"></i> Get Weather
        </button>

        <div class="result-box" id="result">
            <div class="weather-main">
                <p class="city" id="city-name"></p>
                <p class="temp" id="temp"></p>
                <p class="desc" id="desc"></p>
            </div>
            <div class="weather-details">
                <div class="weather-detail">
                    <div class="label"><i class="fas fa-droplet"></i> Humidity</div>
                    <p class="value" id="humidity"></p>
                </div>
                <div class="weather-detail">
                    <div class="label"><i class="fas fa-wind"></i> Wind</div>
                    <p class="value" id="wind"></p>
                </div>
            </div>
        </div>

        <div class="error-msg" id="error"></div>
    </div>
</div>

<script>
async function getWeather() {
    const city = document.getElementById("city").value.trim();
    if (!city) return;
    const resultDiv = document.getElementById("result");
    const errorDiv = document.getElementById("error");
    resultDiv.style.display = "none";
    errorDiv.style.display = "none";

    const response = await fetch("/get-weather?city=" + encodeURIComponent(city));
    const data = await response.json();

    if (data.error) {
        errorDiv.innerText = data.error;
        errorDiv.style.display = "block";
        return;
    }

    document.getElementById("city-name").innerText = data.name + ", " + data.country;
    document.getElementById("temp").innerText = data.temp + "°C";
    document.getElementById("desc").innerText = data.desc;
    document.getElementById("humidity").innerHTML = '<i class="fas fa-droplet"></i> ' + data.humidity + '%';
    document.getElementById("wind").innerHTML = '<i class="fas fa-wind"></i> ' + data.wind + ' m/s';

    resultDiv.style.display = "block";
}
</script>
{% endblock %}
